name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from constants.version import __version__; print(__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: pyinstaller --noconfirm AutoKey.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoKey-v${{ steps.version.outputs.version }}
          path: dist/AutoKey.exe
          retention-days: 30

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoKey.exe
          name: AutoKey v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
