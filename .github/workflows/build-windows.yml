name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Bundle Tesseract Thai
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { $src = "C:\Program Files (x86)\Tesseract-OCR" }
          $dest = "assets/tesseract"
          New-Item -ItemType Directory -Force -Path "$dest/tessdata" | Out-Null
          Copy-Item "$src/tesseract.exe" $dest
          Copy-Item "$src/*.dll" $dest -ErrorAction SilentlyContinue
          if (Test-Path "$src/tessdata/eng.traineddata") { Copy-Item "$src/tessdata/eng.traineddata" "$dest/tessdata" }
          if (Test-Path "$src/tessdata/tha.traineddata") {
            Copy-Item "$src/tessdata/tha.traineddata" "$dest/tessdata"
          } else {
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/tha.traineddata" -OutFile "$dest/tessdata/tha.traineddata"
          }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from constants.version import __version__; print(__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: pyinstaller --noconfirm AutoKey.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoKey-v${{ steps.version.outputs.version }}
          path: dist/AutoKey
          retention-days: 30

      - name: Zip release folder
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/AutoKey\* -DestinationPath dist/AutoKey-v${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoKey-v${{ steps.version.outputs.version }}.zip
          name: AutoKey v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
