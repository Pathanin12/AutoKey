screen:
  width: 1920
  height: 1080
  scale: 100

automation:
  action_delay: 0.05
  type_interval: 0.02
  fail_safe: true

ui:
  hide_on_start: false
  clear_log_on_start: true
  log_max_lines: 0
  verbose_log: false
  cancel_hotkeys:
    - "control+f9"
    - "esc"

accounts:
  service: "5330-05"
  vat: "1154-00"
  wt: "2132-02"
  cash: "1111-00"

defaults:
  pv_date: ""
  start_from_no: 1

lookup_search:
  confirm_enter_count: 2
  verify_selection: true
  verify_method: ocr
  post_search_wait: 0.4
  selection_match_threshold: 0.85
  selection_ocr_grid_region: [520, 380, 980, 580]
  selection_ocr_name_x: [530, 780]
  selection_ocr_row_height: 22
  selection_ocr_lang: tha
  tesseract_cmd: ""
  dialog_wait: 0.35
  template_retries: 4
  template_retry_delay: 0.15

template_click:
  enabled: true
  fallback_to_keyboard: false
  actions:
    lookup_search:
      label: ปุ่ม ค้นหา
      template_file: btn_search.png
      match_threshold: 0.88
      search_region: [580, 520, 990, 670]
    lookup_ok:
      label: ปุ่ม ตกลง
      template_file: btn_ok.png
      match_threshold: 0.88
      search_region: [580, 520, 990, 670]
    menu_account:
      label: 5.บัญชี
      template_file: menu_account.png
      match_threshold: 0.88
      search_region: [80, 0, 980, 90]
    menu_daily_entry:
      label: 1.ลงประจำวัน
      template_file: menu_daily_entry.png
      match_threshold: 0.88
      search_region: [80, 40, 720, 480]
    menu_payment_journal:
      label: 2.สมุดรายวันจ่าย
      template_file: menu_payment_journal.png
      match_threshold: 0.80
      search_region: [520, 35, 980, 140]

company_switch:
  menu_others: "8"
  submenu_keys: ["8"]
  menu_wait: 0.8
  search_enter_count: 2
  exit_pv_esc_count: 2

window_focus:
  enabled: true
  title_contains: "Express"
  prepare_seconds: 0.1
  wait_after_focus_seconds: 0.15
  required: true
