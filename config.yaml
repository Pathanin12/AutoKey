screen:
  width: 1920
  height: 1080
  scale: 100

automation:
  action_delay: 0.4
  type_interval: 0.03
  fail_safe: true

ui:
  hide_on_start: false
  cancel_hotkeys:
    - "control+f9"
    - "esc"

accounts:
  service: "5330-05"
  vat: "1154-00"
  cash: "1111-00"

defaults:
  pv_date: ""

lookup_search:
  button_tabs: 2
  field_tabs: 0
  confirm_enter_count: 1

template_click:
  enabled: true
  fallback_to_keyboard: true
  actions:
    lookup_search:
      label: ปุ่ม ค้นหา
      template_file: btn_search.png
      match_threshold: 0.88
      search_region: [580, 520, 990, 670]
    lookup_ok:
      label: ปุ่ม ตกลง
      template_file: btn_ok.png
      match_threshold: 0.88
      search_region: [580, 520, 990, 670]

company_switch:
  menu_others: "8"
  submenu_keys: ["8"]
  menu_wait: 0.8
  search_enter_count: 2
  exit_pv_esc_count: 2

window_focus:
  enabled: true
  title_contains: "Express"
  prepare_seconds: 0.1
  wait_after_focus_seconds: 0.15
  required: true
