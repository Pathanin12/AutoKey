screen:
  width: 1920
  height: 1080
  scale: 100

automation:
  action_delay: 0.05
  type_interval: 0.02
  fail_safe: true

ui:
  hide_on_start: false
  clear_log_on_start: true
  log_max_lines: 0
  verbose_log: false
  cancel_hotkeys:
    - "control+f9"
    - "esc"

accounts:
  service: "5330-05"
  vat: "1154-00"
  cash: "1111-00"

defaults:
  pv_date: ""

lookup_search:
  confirm_enter_count: 2
  verify_selection: true
  post_search_wait: 0.25
  selection_name_subitems: [1, 0, 2, 3]
  selection_match_threshold: 0.85
  dialog_wait: 0.35
  template_retries: 4
  template_retry_delay: 0.15

template_click:
  enabled: true
  fallback_to_keyboard: false
  actions:
    lookup_search:
      label: ปุ่ม ค้นหา
      template_file: btn_search.png
      match_threshold: 0.88
      search_region: [580, 520, 990, 670]
    lookup_ok:
      label: ปุ่ม ตกลง
      template_file: btn_ok.png
      match_threshold: 0.88
      search_region: [580, 520, 990, 670]

company_switch:
  menu_others: "8"
  submenu_keys: ["8"]
  menu_wait: 0.8
  search_enter_count: 2
  exit_pv_esc_count: 2

window_focus:
  enabled: true
  title_contains: "Express"
  prepare_seconds: 0.1
  wait_after_focus_seconds: 0.15
  required: true
