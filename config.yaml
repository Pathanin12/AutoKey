screen:
  width: 1920
  height: 1080
  scale: 100

automation:
  action_delay: 0.4
  type_interval: 0.03
  fail_safe: true
  dry_run: true

ui:
  hide_on_start: true
  show_status_overlay: true
  show_region_highlight: true
  demo_reference_image: "assets/reference/12.png"
  cancel_hotkeys:
    - "control+f9"
    - "esc"

accounts:
  service: "5330-05"
  vat: "1154-00"
  cash: "1111-00"

defaults:
  pv_date: ""

lookup_search:
  button_tabs: 2
  field_tabs: 0
  confirm_enter_count: 1

# โฟล์สุดท้าย — หลังจบ PV: Esc → 8→8 (ไม่ค้นหา)
company_switch:
  menu_others: "8"
  submenu_keys: ["8"]
  menu_wait: 0.8
  search_enter_count: 2
  exit_pv_esc_count: 2

window_focus:
  enabled: true
  title_contains: "Express"
  prepare_seconds: 0.3
  wait_after_focus_seconds: 0.5
  required: true
